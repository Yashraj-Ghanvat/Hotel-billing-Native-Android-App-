name: hotel_billing_app
description: Offline-first Native Android Hotel & Restaurant Billing Software
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local Database
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Printing & Export
  blue_thermal_printer: ^1.2.3
  pdf: ^3.11.1
  printing: ^5.13.1

  # Security & File utilities
  crypto: ^3.0.5
  permission_handler: ^11.3.1
  intl: ^0.19.0
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
